{% extends 'base.html' %}

{% block head %}
    <title>🫣</title>
    <link rel="stylesheet" href='/static/thankgod/style.css' />
    <style>
        /* Largest size that fits the screen below the navbar + marquee + soundcloud link (~100px),
           keeping the 1440x924 aspect ratio uncropped */
        .home-video-wrap {
            position: relative; margin: 0 auto;
            width: min(100%, calc((100vh - 100px) * 1440 / 924));
            width: min(100%, calc((100dvh - 100px) * 1440 / 924));
        }
        .home-video-wrap video { display: block; width: 100%; height: auto; aspect-ratio: 1440 / 924; cursor: pointer; }
        .soundcloud-link { display: block; margin: 10px auto; text-align: center; font-size: 18px; }
        #sound-toggle {
            position: absolute; bottom: 12px; right: 12px;
            padding: 8px 12px; font-size: 16px;
            border: none; border-radius: 20px;
            background: rgba(0, 0, 0, 0.6); color: #fff; cursor: pointer;
        }
    </style>
{% endblock %}

{% block body %}
        <marquee>next show in bushwick - reach out :) - <a href="join">more soon 💌</a></marquee>
        {% if show_video %}
            <div class="home-video-wrap">
                <video id="home-video" src="{{ asset_url('home-video.mp4') }}" autoplay muted loop playsinline></video>
                <button id="sound-toggle" type="button">🔇 tap for sound</button>
            </div>
            <a class="soundcloud-link" href="https://soundcloud.com/kr_sh/handsome-mix-live-the-depths-part-2">soundcloud</a>
            <script>
                (function () {
                    var video = document.getElementById('home-video');
                    var button = document.getElementById('sound-toggle');
                    button.addEventListener('click', function () {
                        video.muted = !video.muted;
                        if (!video.muted) { video.play(); }
                        button.textContent = video.muted ? '🔇 tap for sound' : '🔊 sound on';
                    });
                    // Tapping the video plays/pauses it (covers phones where autoplay is blocked, e.g. iOS Low Power Mode)
                    video.addEventListener('click', function () {
                        if (video.paused) { video.play(); } else { video.pause(); }
                    });
                })();
            </script>
        {% else %}
            <small><sup> scroll right ->>></sup></small>
            <a href="https://www.youtube.com/watch?v=6BFbtAfCFk0">
                <img src="{{ asset_url('handsome1.jpg') }}" alt="pic by the amazing @smilingeyesmedia_">
            </a>
            pic by the amazing @smilingeyesmedia_
        {% endif %}

        <!-- {% if is_computer %} -->

        <!-- {% else %} -->
            <!-- <img id='bg_img_big_mobile' src="{{ url_for('static', filename=background) }}"> -->
        <!-- {% endif %} -->

{% endblock %}
